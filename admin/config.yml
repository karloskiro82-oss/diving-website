backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "trips"
    label: "الرحلات"
    folder: "_posts/trips"
    create: true
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "الوصف", name: "body", widget: "markdown"}
